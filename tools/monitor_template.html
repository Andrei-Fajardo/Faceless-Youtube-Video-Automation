<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="assets/gsap.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
#root { position:absolute; inset:0; overflow:hidden; background:#000; font-family:"Inter", sans-serif; }
#stage { position:absolute; inset:0; overflow:hidden; filter:url(#warp); }
#world, #breath { position:absolute; inset:0; }
.pimg { position:absolute; left:0; top:0; width:1080px; height:1920px; display:block; will-change:transform; filter:grayscale(1) contrast(1.18) brightness(1.08); }
#tint { position:absolute; inset:0; z-index:5; background:#8fe6b0; mix-blend-mode:multiply; opacity:.62; pointer-events:none; }
#scan { position:absolute; inset:0; z-index:6; pointer-events:none; opacity:.34; background:repeating-linear-gradient(0deg, rgba(0,0,0,.55) 0px, rgba(0,0,0,.55) 1px, rgba(0,0,0,0) 3px, rgba(0,0,0,0) 5px); }
#bar { position:absolute; left:0; width:1080px; height:340px; top:0; z-index:6; pointer-events:none; background:linear-gradient(180deg, rgba(190,255,215,0) 0%, rgba(190,255,215,.10) 50%, rgba(190,255,215,0) 100%); }
#static { position:absolute; inset:0; z-index:7; opacity:0; pointer-events:none; mix-blend-mode:screen; overflow:hidden; }
#vig { position:absolute; inset:0; z-index:8; pointer-events:none; background:radial-gradient(ellipse 78% 64% at 50% 46%, rgba(0,0,0,0) 36%, rgba(0,0,0,.55) 78%, rgba(0,0,0,.9) 100%); }
#grainwrap { position:absolute; inset:0; z-index:9; overflow:hidden; pointer-events:none; opacity:.17; mix-blend-mode:overlay; }
.grainimg { position:absolute; left:0; top:0; width:1620px; height:2880px; background:url(assets/grain.png); background-size:1080px 1920px; }
#staticimg { position:absolute; left:0; top:0; width:1080px; height:1920px; background:url(assets/grain.png); background-size:540px 960px; filter:contrast(2.4); }
#chrome { position:absolute; inset:0; z-index:11; pointer-events:none; font-family:"Courier New", monospace; color:#d6ffe4; text-shadow:0 0 6px rgba(120,255,170,.7); }
#cam { position:absolute; left:64px; top:118px; font-size:34px; letter-spacing:.12em; }
#recdot { display:inline-block; width:20px; height:20px; border-radius:50%; background:#ff3b30; margin-right:14px; box-shadow:0 0 10px #ff3b30; vertical-align:-2px; }
#tsbox { position:absolute; left:64px; top:166px; font-size:30px; letter-spacing:.08em; opacity:.9; height:36px; width:260px; }
.tsx { position:absolute; left:0; top:0; opacity:0; }
#sigbox { position:absolute; right:64px; top:122px; height:34px; display:flex; gap:7px; align-items:flex-end; }
.sb { width:9px; background:#d6ffe4; box-shadow:0 0 6px rgba(120,255,170,.7); }
.sb1 { height:9px; } .sb2 { height:16px; } .sb3 { height:23px; } .sb4 { height:31px; }
.cg { position:absolute; left:0; top:%%CAPTION_Y%%px; width:1080px; height:120px; opacity:0; z-index:12; }
.cgi { position:absolute; left:0; right:0; top:0; text-align:center; font-weight:800; font-size:58px; line-height:1.15; white-space:nowrap; letter-spacing:.01em; }
.cw { display:inline-block; margin:0 6px; color:#eaf6ee; opacity:.55; padding:4px 0; text-shadow:0 2px 16px rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.95), 0 0 2px #000; }
.cw.em { color:#ff5a4d; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.0035 0.011" numOctaves="2" seed="7" result="n" />
    <feDisplacementMap id="disp" in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>
<div id="root" data-composition-id="main" data-start="0" data-duration="%%TOTAL%%" data-width="1080" data-height="1920">
  <div id="stage">
    <div id="world"><div id="breath">
    %%IMGS%%
    </div></div>
    <div id="tint"></div>
    <div id="scan"></div>
    <div id="bar"></div>
  </div>
  <div id="static"><div id="staticimg"></div></div>
  <div id="vig"></div>
  <div id="grainwrap"><div id="grain" class="grainimg"></div></div>
  <div id="chrome">
    <div id="cam"><span id="recdot"></span>CAM 1</div>
    <div id="tsbox">%%TS%%</div>
    <div id="sigbox"><span class="sb sb1"></span><span class="sb sb2"></span><span class="sb sb3"></span><span class="sb sb4"></span></div>
  </div>
  %%CAPS%%
  <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="%%TOTAL%%" data-volume="1"></audio>
</div>
<script>
window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
%%JS%%
window.__timelines["main"] = tl;
tl.seek(0);
</script>
</body>
</html>
